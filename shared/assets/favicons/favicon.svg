<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>SC Web Studio</title>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#060608"/>
  <!-- Logomark: two overlapping rounded rectangles forming an "S" / connectivity motif -->
  <!-- Primary rect: top-left -->
  <rect x="4" y="4" width="15" height="15" rx="4" fill="#5568FF" opacity="0.9"/>
  <!-- Secondary rect: bottom-right — offset creates the intersection pattern -->
  <rect x="13" y="13" width="15" height="15" rx="4" fill="#5568FF" opacity="0.5"/>
  <!-- Intersection highlight -->
  <rect x="13" y="13" width="6" height="6" rx="2" fill="#7B8CFF"/>
</svg>
